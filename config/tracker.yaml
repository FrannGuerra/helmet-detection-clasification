# ==============================================================================
# CONFIGURACIÓN DEL TRACKER — ByteTrack
# ==============================================================================
# NOTA: El tracker solo recibe detecciones de MOTOS (no cabezas).
# Las cabezas se asocian geométricamente sin necesidad de ID de tracking.
# Esto evita que una cabeza "robe" el track_id de una moto cercana.

# Motor de tracking.
# CAMBIO: bytetrack en vez de botsort.
# Con cámaras fijas, el ReID de BoT-SORT no aporta y puede causar swaps de ID.
# ByteTrack es más simple y más estable para este caso de uso.
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 60
match_thresh: 0.90
fuse_score: True
