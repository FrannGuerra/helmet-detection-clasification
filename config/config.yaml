# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DEL SISTEMA DE DETECCIÓN DE CASCOS
# ═══════════════════════════════════════════════════════════════════════════════

# ── Modelos ──────────────────────────────────────────────────────────────
# detection:       Modelo YOLOv8 que detecta motociclistas (riders) en el frame.
# classification:  Modelo YOLOv8-cls que clasifica si llevan casco o no.
models:
  detection: "detector.engine"
  classification: "clasificador.pt"

# ── Video ──────────────────────────────────────────────────────────────────────
# fps:          Frames por segundo de lectura (para HLS).
# resolution:   Resolución de salida de ffmpeg [ancho, alto].
#               ffmpeg reescala el stream a esta resolución antes de entregar frames.
#               El modelo trabaja a 1280px max, no tiene sentido recibir 1080p+ en bruto.
# buffer_size:  Cantidad de frames en el buffer de lectura.
#               CAMBIO: 2 (antes 20). Cola corta = siempre procesa el frame más reciente.
video:
  fps: 8
  resolution: [1280, 720]
  buffer_size: 2
  youtube_delay_ms: 0000

# ── Detección ──────────────────────────────────────────────────────────────────
# confidence_threshold:  Confianza mínima para motos (umbral bajo, el tracker filtra después).
# head_confidence:       Confianza mínima para cabezas (más estricto que motos).
# inside_threshold:      Fracción mínima de la cabeza que debe estar dentro del bbox de moto.
#                        CAMBIO: 0.75 (antes 0.90). El 0.90 perdía cabezas en el borde superior.
# process_interval:      Cada cuántos segundos se analiza un frame (0.05 = ~20 FPS target).
# frames_to_classify:    Mínimo de frames de buena calidad antes de poder clasificar.
# max_frames_to_collect: Máximo de frames a acumular antes de forzar clasificación.
#                        NUEVO: acumula los mejores frames por calidad, no los primeros N.
# min_head_size:         Lado mínimo del bbox de cabeza en px. Menor a esto no clasifica.
# imgsz:                 Tamaño de imagen para inferencia del detector (explícito).
# effective_fps:         FPS efectivo real del sistema (para el Kalman filter del tracker).
detection:
  confidence_threshold: 0.15
  head_confidence: 0.25
  inside_threshold: 0.75
  process_interval: 0.0
  frames_to_classify: 6
  max_frames_to_collect: 10
  min_head_size: 10
  imgsz: 960
  effective_fps: 8

# ── Clasificación ─────────────────────────────────────────────────────────────
# confidence_threshold:  Confianza mínima del clasificador para contar como sin_casco.
#                        CAMBIO: 0.60 (antes 0.80). Con 0.80, un sin_casco con confianza 0.79
#                        se contaba como con_casco (falso negativo). Bajando a 0.60 lo capturamos.
# imgsz:                 Tamaño de entrada del clasificador (definido en
#                        entrenamiento, NO cambiar a menos que re-entrenes).
classification:
  confidence_threshold: 0.60
  imgsz: 64

# ── Alertas ────────────────────────────────────────────────────────────────────
alerts:
  enabled: true
  sound: false

# ── Servidor ───────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 5000
  debug: true

# ── Logging ────────────────────────────────────────────────────────────────────
# access_logs:  Si es true, Flask muestra los logs de cada request HTTP.
logging:
  access_logs: false

# ── Rutas de Almacenamiento ───────────────────────────────────────────────────
# Configura dónde se guardan los datos generados por el sistema.
paths:
  # Ubicación del archivo de base de datos SQLite
  database: "data/detections.db"
  # Directorio base donde se guardarán los recortes (crops) de los motociclistas
  crops_dir: "crops"

# ── Opciones de Guardado de Crops ──────────────────────────────────────────────
save_crops:
  motos: true  
  cabezas: false
  tracking: false

# ═══════════════════════════════════════════════════════════════════════════════
# CÁMARAS
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cada cámara necesita los siguientes campos:
#   - id:      Identificador numérico único.
#   - name:    Nombre descriptivo que se muestra en la interfaz.
#   - source:  URL del stream HLS (.m3u8)
#   - lat:     Latitud (para el mapa de calor, solo relevante en modo en vivo).
#   - lng:     Longitud (para el mapa de calor).
#
# IMPORTANTE:
#   - Se pueden configurar hasta 4 cámaras.
#
# ═══════════════════════════════════════════════════════════════════════════════

